<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ごはんボード</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>ごはんボード</h1>

  <div class="user-select">
    ユーザ
    <select name ="user_button" id="user_button">
      <option value="A">A</option>
      <option value="B">B</option>
      <option value="C">C</option>
      <option value="D">D</option>
    </select>
  </div>

  <div class="header-row">
    <div></div>
    <div>必要</div>
    <div>未確定</div>
    <div>不必要</div>
  </div>

  <div class="meal-row">
    <div>朝食</div>
    <label for="Breakfast_Required">
      <input id="Breakfast_Required" type="radio" name="Breakfast_Schedule" value="〇">
    </label>
    <label for="Breakfast_Undecided">
      <input id="Breakfast_Undecided" type="radio" name="Breakfast_Schedule" value="△">
    </label>
    <label for="Breakfast_Unnecessary">
      <input id="Breakfast_Unnecessary" type="radio" name="Breakfast_Schedule" value="×">
    </label>
  </div>

  <div class="meal-row">
    <div>昼食</div>
    <label for="Lunch_Required">
      <input id="Lunch_Required" type="radio" name="Lunch_Schedule" value="〇">
    </label>
    <label for="Lunch_Undecided">
      <input id="Lunch_Undecided" type="radio" name="Lunch_Schedule" value="△">
    </label>
    <label for="Lunch_Unnecessary">
      <input id="Lunch_Unnecessary" type="radio" name="Lunch_Schedule" value="×">
    </label>
  </div>

  <div class="meal-row">
    <div>夕食</div>
    <label for="Dinner_Required">
      <input id="Dinner_Required" type="radio" name="Dinner_Schedule" value="〇">
    </label>
    <label for="Dinner_Undecided">
      <input id="Dinner_Undecided" type="radio" name="Dinner_Schedule" value="△">
    </label>
    <label for="Dinner_Unnecessary">
      <input id="Dinner_Unnecessary" type="radio" name="Dinner_Schedule" value="×">
    </label>
  </div>

  <button id="Submit_Button" type="button">登録する</button>
  <button id="Clear_Button" type="button">クリア</button>

  <script src="app.js"></script>
</body>
</html>
